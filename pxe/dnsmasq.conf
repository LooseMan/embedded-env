# --- /etc/dnsmasq.conf ---

# ★1. DNS機能（ポート53）のみを無効化する
port=0

# ★2. インターフェース指定
# interface=virbr0
# bind-interfaces
except-interface=lo

# ★3. DHCP proxy モード（重要！）
# IP割り当ては行わず、既存DHCP（libvirt）の応答に被せてPXE情報だけを返す
dhcp-range=192.168.122.0,proxy,255.255.255.0

# ★4. UEFI 64-bitクライアントの識別
dhcp-match=set:efi64,option:client-arch,7
dhcp-match=set:efi64,option:client-arch,9

# ★5. PXEブートファイル指定
dhcp-boot=tag:efi64,images/pxeboot/vmlinuz

# ★6. TFTPサーバー機能の有効化
enable-tftp
tftp-root=/var/lib/tftpboot
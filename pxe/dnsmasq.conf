# --- /etc/dnsmasq.conf ---

# ログ出力（デバッグ用・本番稼働でログを減らしたい場合はコメントアウト可）
log-dhcp

# 1. DNS機能を無効化（53ポート解放）
port=0

# 2. バインド設定（全インターフェースで受信、ループバックのみ除外）
except-interface=lo

# 3. DHCP Proxy モード設定（既存ルーター 192.168.2.1 と併調）
dhcp-range=192.168.2.0,proxy,255.255.255.0

# 4. UEFI クライアント識別（Arch 7 / Arch 9）
dhcp-match=set:efi64,option:client-arch,7
dhcp-match=set:efi64,option:client-arch,9

# 5. PXE ブート指定（Proxy応答メニュー ＆ TFTPサーバーIP指定）
pxe-service=tag:efi64,X86-64_EFI,"Install AlmaLinux 9",BOOTX64.EFI
dhcp-boot=tag:efi64,BOOTX64.EFI,192.168.2.133

# 6. TFTP サーバー設定
enable-tftp
tftp-root=/var/lib/tftpboot
name: Build and publish Ansible image

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-ansible-image.yml"
      - "ansible/docker/Dockerfile-v2"
      - "ansible/docker/.dockerignore"
      - "ansible/docker/ansible.cfg"
  pull_request:
    paths:
      - ".github/workflows/publish-ansible-image.yml"
      - "ansible/docker/Dockerfile-v2"
      - "ansible/docker/.dockerignore"
      - "ansible/docker/ansible.cfg"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/ansible
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ansible/docker
          file: ansible/docker/Dockerfile-v2
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ansible
          cache-to: type=gha,mode=max,scope=ansible
